<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
    <script type="module">
        import { auth } from "./js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });
    </script>
</head>

<body>
    <header class="text-white py-3">
        <div class="container-fluid" style="position:relative;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <h1 style="margin: 0;">Gestión de Ventas</h1>
                <button id="muteBtn" title="Silenciar sonido"
                    style="background:none;border:none;cursor:pointer;display:flex;align-items:center;">
                    <svg id="muteIcon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#fff" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03z"/>
                        <path id="muteCross" d="M19 9.5l-1.41 1.41L16.09 9.5l-1.41 1.41L17.59 12l-2.91 2.91 1.41 1.41L16.09 14.5l1.41 1.41 1.41-1.41-2.91-2.91z" style="display:none;"/>
                    </svg>
                </button>
            </div>
            <nav class="navbar navbar-expand-lg navbar-dark">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="clientes.html">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#1976d2"
                                    viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;">
                                    <path
                                        d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
                                </svg>
                                Clientes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#1976d2"
                                    viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;">
                                    <path
                                        d="M21 7V3a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1zm-2-2h-2V4h2v1zM9 7V3a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1zm-2-2H5V4h2v1zm12 12v-4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1zm-2-2h-2v-1h2v1zM9 19v-4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1zm-2-2H5v-1h2v1z" />
                                </svg>
                                Productos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="facturas.html">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#1976d2"
                                    viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;">
                                    <path
                                        d="M19 3h-1V2a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v1H5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-2 0H7V2h10v1zm3 17a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V4h1a1 1 0 0 1 1 1zm-7-7h-4v-2h4zm0 4h-4v-2h4z" />
                                </svg>
                                Facturas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="logoutBtnMenu">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#f44336"
                                    viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 6px;">
                                    <path
                                        d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8c-1.1 0-2 .9-2 2v4h2V5h8v14h-8v-4h-2v4c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
                                </svg>
                                Salir
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    <main class="container mt-4">
        <h2>Bienvenido al sistema</h2>
        <p>Selecciona una opción del menú para comenzar.</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="js/sonido-click.js"></script>
        <script type="module">
            import { auth } from "./js/firebase.js";
            import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
            document.getElementById("logoutBtnMenu").addEventListener("click", async (e) => {
                e.preventDefault();
                await signOut(auth);
                window.location.href = "login.html";
            });
        </script>
</body>

</html>
